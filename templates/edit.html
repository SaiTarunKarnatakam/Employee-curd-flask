<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee Record</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333333;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-update {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-update:hover {
            background-color: #0056b3;
        }

        .btn-cancel {
            color: #555;
            text-decoration: none;
            font-size: 14px;
            margin-left: 10px;
        }

        .btn-cancel:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Edit Employee #{{ employee['id'] }}</h2>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">

        <form method="POST">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name" value="{{ employee['name'] }}" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" value="{{ employee['email'] }}" required>
            </div>

            <div class="form-group">
                <label>Department:</label>
                <input type="text" name="department" value="{{ employee['department'] }}" required>
            </div>

            <div class="form-group">
                <label>Role:</label>
                <input type="text" name="role" value="{{ employee['role'] }}" required>
            </div>

            <button type="submit" class="btn-update">Update Record</button>
            <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </form>
    </div>

</body>
</html>
